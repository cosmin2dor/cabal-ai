[project]
name = "cabal-ai"
version = "0.0.1"
description = "Your AI Team right on your Slack. Open-source and forkable."
readme = "README.md"
authors = [
    { name = "Cosmin Tudor", email = "cosmin2dor@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.38",
]

[project.scripts]
cabal = "cabal_ai:main"
db = "core.db:init_db"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]                                                                                                                                          
norecursedirs = ["draft", ".venv"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",                                                                                                                                                   
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
