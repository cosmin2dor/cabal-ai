[project]
name = "cabal-ai"
version = "0.0.1"
license = "AGPL-3.0-only"
description = "Your AI Team right on your Slack. Open-source and forkable."
readme = "README.md"
authors = [
    { name = "Cosmin Tudor", email = "cosmin2dor@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.38",
]

[project.scripts]
cabal = "cabal_ai:main"
db = "core.db:init_db"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "mypy>=1.20.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]                                                                                                                                          
norecursedirs = ["draft", ".venv"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",                                                                                                                                                   
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "draft/",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "draft/",
]

[tool.ruff.lint.per-file-ignores]                                                                                                                                  
"src/tests/conftest.py" = ["E402"]
